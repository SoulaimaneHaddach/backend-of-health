name: Deploy to Render (on Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Deploy to Render
        if: success()
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/deploy \
            --header 'accept: application/json' \
            --header "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data '{"clearCache": "false"}'
        continue-on-error: true
        env:
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

      - name: Verify Deployment
        run: |
          echo "Deployment triggered. Check Render dashboard for status."
          echo "Service: https://dashboard.render.com/services/${{ secrets.RENDER_SERVICE_ID }}"
