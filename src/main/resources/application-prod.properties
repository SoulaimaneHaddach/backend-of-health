# ======================
# Production Profile
# ======================
# This file overrides defaults for production environment.
# Use Spring profiles to activate: SPRING_PROFILES_ACTIVE=prod

# ======================
# Application
# ======================
server.port=8080
spring.application.name=healing_backend

# ======================
# Logging (Production: minimal overhead)
# ======================
logging.level.root=WARN
logging.level.com.rickbot.healing_backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ======================
# Database (MySQL on production DB host)
# ======================
# Use environment variables or secrets manager for credentials
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari Connection Pool (tuned for production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================
# JWT
# ======================
# Use secrets manager in production, not hardcoded!
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# ======================
# Server Compression
# ======================
server.compression.enabled=true

# ======================
# Flyway migrations
# ======================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1KB

# ======================
# Actuator / Metrics (Production)
# ======================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.process.files=false
management.metrics.enable.process=true
management.metrics.enable.jvm=true
management.metrics.enable.tomcat=true

# ======================
# Caching (Production: Redis)
# ======================
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:redis}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.username=${REDIS_USERNAME:}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=2000ms
spring.redis.ssl=${REDIS_SSL:false}

# Cache configuration (per-cache TTLs)
app.cache.default-spec=maximumSize=10000,expireAfterWrite=10m
app.cache.doctors-spec=maximumSize=5000,expireAfterWrite=15m

# ======================
# Doctor Query Limits
# ======================
app.doctors.max-results=2000

# ======================
# JVM / GC (via environment/Docker)
# ======================
# Set via JAVA_TOOL_OPTIONS or Docker env; examples:
# -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError
