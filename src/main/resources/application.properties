# ======================
# Application
# ======================
spring.application.name=healing_backend
server.port=8080
spring.profiles.active=local

# ======================
# MySQL Database (LOCAL)
# Use environment variables when possible to avoid committing secrets.
# To run locally (PowerShell):
#   $env:SPRING_DATASOURCE_PASSWORD="your_password"; .\mvnw.cmd -DskipTests package
# Or set these variables in your run configuration / CI.
# ======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password='${SPRING_DATASOURCE_PASSWORD:}'
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================
# Hikari Connection Pool
# ======================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================
# JWT
# ======================
app.jwt.secret=ZmM4ZDQ4YzI5ZTg5ZDA2MTU2Y2JlZjYxMzIyZTg2NzY4MTZkNDEyNmY2YjA1ZjU1YzM3NzQ0ZjMwZDQwMjk1Nw==
app.jwt.expiration=3600000

# ======================
# Logging (Dev)
# ======================
logging.level.com.rickbot.healing_backend=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG

# ======================
# Tomcat Access Logs
# ======================
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

# ======================
# Server Compression
# ======================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1KB

# ======================
# Actuator
# ======================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# ======================
# Caching
# ======================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m

# ======================
# App Limits
# ======================
app.doctors.max-results=1000

# ======================
# Notifications
# ======================
app.notifications.push.enabled=true


