# ======================
# Application
# ======================
spring.application.name=healing_backend
server.port=8080

# ======================
# MySQL Database (Railway Environment Variables)
# ======================
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=YFlNzhbLrWzlgJAutNkOdOxdADhCsPoH
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================
# JWT
# ======================
app.jwt.secret=ZmM4ZDQ4YzI5ZTg5ZDA2MTU2Y2JlZjYxMzIyZTg2NzY4MTZkNDEyNmY2YjA1ZjU1YzM3NzQ0ZjMwZDQwMjk1Nw==
app.jwt.expiration=3600000

# ======================
# DevTools
# ======================
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

# ======================
# Server Compression
# ======================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1KB

# ======================
# Actuator / Metrics
# ======================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.enable.process.files=false

# Prometheus scrape endpoint
management.endpoints.web.base-path=/actuator

# ======================
# Caching
# ======================
spring.cache.type=caffeine
# Caffeine specification: maximumSize=10_000, expireAfterWrite=10m
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m

# Maximum number of doctors fetched in list/map queries to avoid full table scans
app.doctors.max-results=1000

# ======================
# Redis (optional distributed cache)
# ======================
# Example (uncomment and configure for your environment):
# spring.redis.host=redis
# spring.redis.port=6379
# spring.redis.username=
# spring.redis.password=
# spring.redis.timeout=2000ms

# ======================
# JVM / Performance hints
# ======================
# Prefer not to enable debug logging in production; keep INFO by default
logging.level.com.rickbot.healing_backend=INFO

# ======================
# Notifications (Optional disable for dev/staging)
# ======================
app.notifications.push.enabled=true
