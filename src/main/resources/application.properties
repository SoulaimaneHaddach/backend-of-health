spring.application.name=healing_backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/healing
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.secret=ZmM4ZDQ4YzI5ZTg5ZDA2MTU2Y2JlZjYxMzIyZTg2NzY4MTZkNDEyNmY2YjA1ZjU1YzM3NzQ0ZjMwZDQwMjk1Nw==
app.jwt.expiration=3600000

# DevTools
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

# Debug/logging to help diagnose 403 issues from frontend
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG

# Enable simple access logs so we can confirm requests reach the server
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t \"%r\" %s %b
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
