# ======================
# Application
# ======================
spring.application.name=healing_backend
server.port=8080

# ======================
# MySQL Database (Railway Environment Variables)
# ======================
spring.datasource.url=${DATABASE_URL}           
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================
# JWT
# ======================
app.jwt.secret=ZmM4ZDQ4YzI5ZTg5ZDA2MTU2Y2JlZjYxMzIyZTg2NzY4MTZkNDEyNmY2YjA1ZjU1YzM3NzQ0ZjMwZDQwMjk1Nw==
app.jwt.expiration=3600000

# ======================
# DevTools
# ======================
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

# ======================
# Server Compression
# ======================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1KB

# ======================
# Redis Configuration (Railway Environment Variables)
# ======================

# Option A: If Railway provides host, port, password separately
# spring.data.redis.host=${REDISHOST:127.0.0.1}
# spring.data.redis.port=${REDISPORT:6379}
# spring.data.redis.password=${REDISPASSWORD:}
# spring.data.redis.ssl.enabled=true
# spring.cache.type=redis
# spring.cache.redis.time-to-live=600000

# Option B: If Railway provides full URL (preferred if available)
 spring.data.redis.url=${REDIS_URL}
 spring.cache.type=redis
 spring.cache.redis.time-to-live=600000

# ======================
# Optional Logging Level
# ======================
logging.level.org.springframework.data.redis=INFO
logging.level.io.lettuce.core=INFO
