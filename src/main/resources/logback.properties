# Logging configuration
# Note: include UTF-8 in your JVM options if you see emoji/encoding issues:
# add `-Dfile.encoding=UTF-8` to JAVA_OPTS when starting the app.
logging.level.root=INFO
logging.level.com.rickbot.healing_backend=DEBUG
# Console pattern: keep it compact; emoji are emitted from the messages themselves
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
# File pattern (includes timestamp, thread, level, logger) - keep UTF-8 when writing
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n